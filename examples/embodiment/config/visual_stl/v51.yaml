# Pure-visual v5.1 AGM reward settings. This config is composed into both
# env.train and env.eval by the visual PPO experiment.
agm_reward_source: visual
visual_stl_monitor: true
# One-shot reward emitted when visual AGM first reports completion.
# LIBERO environment success is used only for success metrics.
visual_stl_completion_bonus: 1.0
visual_stl_yoloe_per_gpu: true
visual_stl_yoloe_host: 127.0.0.1
visual_stl_yoloe_base_port: 8010
visual_stl_yoloe_timeout_s: 10.0
visual_stl_yoloe_batch_enabled: true
visual_stl_yoloe_batch_max_size: 32
visual_stl_yoloe_raw_transport: true
visual_stl_camera_name: agentview
visual_stl_fallback_camera_name: robot0_eye_in_hand
visual_stl_fallback_min_confidence: 0.10
visual_stl_mask_to_depth_orientation: rot180
visual_stl_min_confidence: 0.25
visual_stl_debug_interval: 0
# Lossless, pre-overlay RGB export for detector A/B. Disabled in normal
# evaluation; when enabled it records the exact upright arrays supplied to
# YOLOE for the primary and fallback cameras.
visual_stl_export_raw_rgb: false
visual_stl_raw_rgb_stride: 1
visual_stl_save_atom_diagnostics: false
# Causal filtering uses only the current and preceding valid raw margins.
# Every atom applies a five-sample median, two-sample jump confirmation, and
# EMA before AGM normalization. Invalid samples never enter the filter.
visual_stl_temporal_median_window: 5
visual_stl_temporal_ema_alpha: 0.30
visual_stl_temporal_max_jump: 0.05
visual_stl_temporal_jump_confirmation_steps: 2
visual_stl_temporal_jump_consistency: 0.025
visual_stl_surface_radius_m: 0.05
visual_stl_center_radius_m: 0.165

visual_stl_grasp_confirmation_steps: 3
# Preserve the standard Pick formula. A secondary terminal-closure path only
# tolerates the measured 1 mm co-motion / 0.5 mm motion boundary miss after
# two fresh RGB-D frames with the gripper physically closed to <= 5 cm.
visual_stl_grasp_terminal_width_m: 0.050
visual_stl_grasp_terminal_comove_slack_m: 0.001
visual_stl_grasp_terminal_motion_slack_m: 0.0005
visual_stl_grasp_terminal_confirmation_steps: 2
visual_stl_on_xy_tolerance_m: 0.06
visual_stl_on_surface_tolerance_m: 0.038
visual_stl_on_ordinary_xy_tolerance_m: 0.030
visual_stl_on_ordinary_xy_uncertainty_m: 0.014
visual_stl_on_ordinary_min_above_m: -0.005
visual_stl_on_ordinary_surface_tolerance_m: 0.030
visual_stl_on_ordinary_require_release: true
visual_stl_on_ordinary_require_contact: true
visual_stl_on_ordinary_contact_tolerance_m: 0.010
visual_stl_on_ordinary_confirmation_steps: 5
visual_stl_on_confirmation_steps: 3
visual_stl_on_site_lower_delta_m: -0.22
visual_stl_on_site_upper_delta_m: 0.09

visual_stl_on_front_x_lower_m: 0.120
visual_stl_on_front_x_upper_m: 0.240
visual_stl_on_front_y_lower_m: -0.040
visual_stl_on_front_y_upper_m: 0.050
visual_stl_on_front_z_lower_m: -0.030
visual_stl_on_front_z_upper_m: 0.030
visual_stl_on_front_confirmation_steps: 7

visual_stl_on_spatial_min_displacement_m: 0.030
visual_stl_on_spatial_stability_tolerance_m: 0.003
visual_stl_on_right_min_displacement_m: 0.135
visual_stl_on_right_released_min_displacement_m: 0.100
visual_stl_on_right_interior_margin_m: 0.015
visual_stl_on_right_recovery_slack_m: 0.015
visual_stl_on_right_recovery_min_displacement_m: 0.160
visual_stl_on_right_released_slack_m: 0.020
visual_stl_on_right_release_max_age_steps: 30
visual_stl_on_right_lateral_padding_m: 0.010
visual_stl_on_right_max_offset_m: 0.060
visual_stl_on_right_require_release: false
visual_stl_on_right_pick_proxy: true
visual_stl_on_right_confirmation_steps: 5

visual_stl_on_attach_width_m: 0.065
visual_stl_on_attach_confirmation_steps: 1
visual_stl_on_release_width_m: 0.075
visual_stl_on_release_hold_steps: 30
visual_stl_on_support_cache_steps: 480
visual_stl_on_require_fresh_after_release: true

visual_stl_in_monitor: true

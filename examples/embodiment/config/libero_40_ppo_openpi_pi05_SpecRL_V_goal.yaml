defaults:
  - env/libero_goal@env.train
  - env/libero_goal@env.eval
  - visual_stl/v51@env.train
  - visual_stl/v51@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_40_ppo_openpi_pi05_SpecRL_V_goal"
    logger_backends: ["tensorboard"]
  max_epochs: 100
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: -10.0
  rewards_upper_bound: 10.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2
    total_num_envs: 128
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    use_ordered_reset_state_ids: true
    use_rel_reward: true
    ignore_terminations: true
    auto_reset: false
    reward_coef: 0.0
    use_step_penalty: false
    stl_reward: true
    stl_tau: 60
    stl_reward_scale: 1.0
    stl_gamma: 0.99
    stl_clip_min: -1.0
    stl_clip_max: 0.0
    stl_clip: 10.0
    stl_pred_config:
      r_grasp: 0.10
    stl_fallback_bddl: true
    agm_stage_confirmation_steps: 3
    agm_debug_pick_components: false
    agm_debug_gripper_bodies: false
    visual_stl_export_raw_rgb: false
    visual_stl_save_atom_diagnostics: false
    # Issue11 YOLOE Batch V2. Keep these overrides in this training config so
    # the established command cannot silently fall back to the slow path.
    visual_stl_yoloe_per_gpu: true
    visual_stl_yoloe_host: "127.0.0.1"
    visual_stl_yoloe_base_port: 8010
    visual_stl_yoloe_batch_enabled: true
    visual_stl_yoloe_batch_max_size: 32
    visual_stl_yoloe_raw_transport: true
    stl_plot_dir: ${runner.logger.log_path}/stl_plots/train
    stl_save_plots: false

  eval:
    rollout_epoch: 1
    total_num_envs: 500
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    auto_reset: true
    ignore_terminations: true
    reward_coef: 0.0
    use_step_penalty: false
    use_rel_reward: true
    use_fixed_reset_state_ids: true
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    stl_reward: true
    stl_tau: 60
    stl_reward_scale: 1.0
    stl_gamma: 0.99
    stl_clip_min: -1.0
    stl_clip_max: 0.0
    stl_clip: 10.0
    stl_pred_config:
      r_grasp: 0.10
    stl_fallback_bddl: true
    agm_stage_confirmation_steps: 3
    agm_debug_pick_components: false
    agm_debug_gripper_bodies: false
    visual_stl_export_raw_rgb: false
    visual_stl_save_atom_diagnostics: false
    # Keep eval on the same V2 transport and routing as train.
    visual_stl_yoloe_per_gpu: true
    visual_stl_yoloe_host: "127.0.0.1"
    visual_stl_yoloe_base_port: 8010
    visual_stl_yoloe_batch_enabled: true
    visual_stl_yoloe_batch_max_size: 32
    visual_stl_yoloe_raw_transport: true
    stl_plot_dir: ${runner.logger.log_path}/stl_plots/eval
    stl_save_plots: false

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:_SFT_CHECKPOINT}
    model_type: "openpi"
    precision: ${actor.model.precision}
    num_action_chunks: 10
    openpi:
      config_name: "pi05_libero"
      noise_level: 0.5
      train_expert_only: true

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 2048
  seed: 2026
  enable_offload: false
  model:
    model_path: ${oc.env:_SFT_CHECKPOINT}
    model_type: "openpi"
    add_value_head: true
    openpi:
      value_after_vlm: true
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: 200
    min_lr_rate: 0.1
    lr_scheduler: "cosine"
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false

